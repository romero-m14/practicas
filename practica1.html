<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./style.css" />
    <title>Stats Preview Card - Imagen Completa Mobile</title>
  </head>
  <body class="bg-[#0a0c1b] flex items-center justify-center min-h-screen p-4 md:p-6">
    
    <main class="max-w-[1110px] bg-[#1c1938] rounded-xl overflow-hidden flex flex-col md:flex-row-reverse">
      
      <div class="bg-[#aa5cdb] w-full md:w-1/2 flex items-center justify-center overflow-hidden">
        <img 
          src="./images/desktop/image-header-mobile.jpg"
          alt="Business Insights" 
          class="w-full h-auto object-contain md:object-cover md:h-full opacity-75 mix-blend-multiply transition-all duration-300"
        />
      </div>

      <section class="p-8 md:p-16 text-center md:text-left md:w-1/2 flex flex-col justify-center">
        
        <h1 class="text-white text-5xl md:text-4xl font-bold leading-tight mb-6">
          Get <span class="text-[#aa5cdb]">insights</span> that help your business grow.
        </h1>

        <p class="text-gray-400 text-4xl md:text-base leading-relaxed mb-10 md:mb-16">
          lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas voluptate, doloremque, quisquam, alias deleniti corporis voluptate
        </p>

        <div class="flex flex-col md:flex-row justify-between gap-8 md:gap-0">
          <div class="flex flex-col items-center md:items-start">
            <p class="text-white text-5xl font-bold">10k+</p>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-1">Companies</p>
          </div>
          <div class="flex flex-col items-center md:items-start">
            <p class="text-white text-5xl font-bold">314</p>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-1">Templates</p>
          </div>
          <div class="flex flex-col items-center md:items-start">
            <p class="text-white text-5xl font-bold">12M+</p>
            <p class="text-gray-400 text-xs uppercase tracking-widest mt-1">Queries</p>
          </div>
        </div>

      </section>
    </main>

  </body>
</html>
