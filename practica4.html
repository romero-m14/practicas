<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="./Jason/darkmode.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Document</title>
  </head>
  <body
    id="body"
    class="bg-[#e0e8ff] dark:bg-gray-900 min-h-screen flex flex-col justify-center items-center gap-6 transition-colors duration-300"
  >
    <button
      id="btndark"
      class="z-50 bg-black dark:bg-white text-white dark:text-black w-12 h-12 flex items-center justify-center rounded-full shadow-lg hover:scale-110 transition-transform cursor-pointer"
    >
      <span class="dark:hidden text-xl">🌙</span>
      <span class="hidden dark:block text-xl">☀️</span>
    </button>

    <main
      class="bg-white dark:bg-gray-800 rounded-[2rem] max-w-[380px] overflow-hidden shadow-2xl transition-colors duration-300"
    >
      <img
        src="./images/illustration-hero.svg"
        alt="persona escuchando musica"
      />
      <button class="px-4 py-2 bg-white rounded-2xl border absolute top-10 rotate-30">
        Musica
      </button>
      <section class="p-8 flex justify-center items-center flex-col gap-3">
        <h1 class="font-bold text-2xl">Order Summary</h1>
        <p class="text-center text-[#7280a7]">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Aspernatur
          soluta quas laboriosam et expedita qui tempore eos at distinctio minus
          delectus hic, perferendis ut animi quae, libero cumque magni
          inventore.
        </p>
        <div class="bg-[#f5f7ff] flex gap-5 p-6 rounded-2x1">
          <img src="./images/icon-music.svg" alt="" />
          <div class="flex flex-col">
            <span class="font-bold">Annual Plan</span>
            <span class="text-[#7280a7]">$59.99/year</span>
          </div>
          <button
            class="ml-7 underline text-[#3829e0] font-bold hover:no-underline hover:text-[#766cf1] cursor-pointer transition-all active:opacity-70"
          >
            Change
          </button>
        </div>
        <div class="flex flex-col items-center w-full gap-4">
          <button
            class="bg-[#3829e0] hover:bg-[#5244e7] active:scale-95 transition-all text-white font-bold w-[95%] h-14 rounded-xl cursor-pointer shadow-lg"
          >
            Proceed to Payment
          </button>

          <button
            class="font-bold text-[#7280a7] hover:text-[#1f2f56] transition-colors cursor-pointer"
          >
            Cancel Order
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
